name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Mobile platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production
      submit:
        description: "Submit the EAS build after preflight checks"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  eas-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Validate EAS token
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          if [ -z "$EAS_TOKEN" ]; then
            echo "EAS_TOKEN secret is required to run mobile artifact builds."
            echo "Create it with: npx eas-cli@12 token:create"
            exit 1
          fi

          npx --yes eas-cli@12 whoami --non-interactive

      - name: Run EAS build
        if: ${{ inputs.submit }}
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          npx --yes eas-cli@12 build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Skip EAS build submission
        if: ${{ !inputs.submit }}
        run: |
          echo "Preflight checks passed. Build submission was skipped because submit=false."

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Mobile Build"
            echo ""
            echo "- Platform: ${{ inputs.platform }}"
            echo "- Profile: ${{ inputs.profile }}"
            echo "- Submit: ${{ inputs.submit }}"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
